<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acrobatics Program | IWACU FOUNDATION</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Segoe UI, sans-serif;
margin:0;
background:#f4f7fb;
color:#1a2b4c;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:#0b3d91;
color:white;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin:0 15px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:600;
}

nav ul li a:hover{
color:#ff7a00;
}

/* HERO */

.hero{
height:60vh;
background:url("https://images.unsplash.com/photo-1542751371-adc38448a05e") center/cover;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.hero h1{
font-size:50px;
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
}

/* SECTION */

.section{
padding:80px 40px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:40px;
}

/* CARDS */

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
background:#ff7a00;
color:white;
}

.card i{
font-size:40px;
margin-bottom:10px;
}

/* GALLERY */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.gallery img{
width:100%;
border-radius:10px;
transition:0.4s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* FOOTER */

footer{
background:#0b3d91;
color:white;
text-align:center;
padding:40px;
margin-top:50px;
}

footer a{
color:#ff7a00;
margin:0 10px;
font-size:20px;
}

</style>

</head>
