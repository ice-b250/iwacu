<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IWACU FOUNDATION | Contact</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    font-family:'Segoe UI', sans-serif;
    background:#f4f7fb;
    margin:0;
    color:#1a2b4c;
}

/* NAVBAR */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
    background:#0b3d91;
    color:white;
}

nav .logo{
    font-size:22px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin:0 15px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

nav ul li a:hover{
    color:#ff7a00;
    transform:scale(1.1);
}

/* CONTACT SECTION */
.section{
    padding:80px 40px;
    text-align:center;
}

form{
    max-width:500px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

form input, form textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

form button{
    padding:12px 20px;
    background:#0b3d91;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

form button:hover{
    background:#ff7a00;
    transform:scale(1.05);
}

/* FOOTER */
footer{
    background:#0b3d91;
    color:white;
    text-align:center;
    padding:40px;
}

footer a{
    color:#ff7a00;
    margin:0 10px;
    font-size:20px;
    transition:.3s;
}

footer a:hover{
    color:white;
    transform:scale(1.3);
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
    <div class="logo"><i class="fa-solid fa-palette"></i> IWACU FOUNDATION</div>
    <ul>
        <li><a href="iwacu-foundation.html">Home</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- CONTACT SECTION -->
<section class="section" id="contact">
<h2>Contact Us</h2>
<form id="contactForm">
    <input type="text" placeholder="Your Name" name="name" required>
    <input type="email" placeholder="Your Email" name="email" required>
    <textarea rows="5" placeholder="Your Message" name="message" required></textarea>
    <button type="submit">Send Message</button>
</form>
</section>

<!-- FOOTER -->
<footer>
<p>© 2026 IWACU FOUNDATION</p>
<div>
<a href="#"><i class="fa-brands fa-facebook"></i></a>
<a href="#"><i class="fa-brands fa-instagram"></i></a>
<a href="#"><i class="fa-brands fa-tiktok"></i></a>
<a href="#"><i class="fa-brands fa-x-twitter"></i></a>
<a href="#"><i class="fa-brands fa-youtube"></i></a>
</div>
</footer>

<script>
// Optional: simple JS alert on form submission
document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    alert("Thank you! Your message has been sent.");
    this.reset();
});
</script>

</body>
</html>
